<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>残置物撤去チラシ（コミック案）</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;900&family=Kaisei+Decol&display=swap"
        rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            width: 210mm;
            height: 297mm;
            font-family: 'Noto Sans JP', sans-serif;
            background: #fff;
            color: #333;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            height: 100%;
            padding: 10mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Comic Grid */
        .comic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            height: 60%;
            margin-bottom: 20px;
        }

        .panel {
            border: 4px solid #000;
            position: relative;
            overflow: hidden;
            background: #f9f9f9;
        }

        .panel-1 {
            grid-column: 1 / 2;
        }

        .panel-2 {
            grid-column: 2 / 3;
        }

        .panel-3 {
            grid-column: 1 / 3;
            background: #fff0f5;
        }

        /* Bubbles */
        .bubble {
            position: absolute;
            background: #fff;
            border: 3px solid #000;
            border-radius: 50%;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .bubble::after {
            content: '';
            position: absolute;
            border-style: solid;
            border-width: 10px 10px 0;
            border-color: #000 transparent;
            display: block;
            width: 0;
            z-index: 1;
            bottom: -10px;
            left: 40%;
        }

        /* Panel Content */
        .p1-text {
            top: 10px;
            left: 10px;
            width: 80%;
            font-size: 14pt;
        }

        .p1-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }

        .p2-text {
            top: 20px;
            right: 10px;
            width: 80%;
            font-size: 16pt;
            color: #c0392b;
        }

        .p3-main {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
        }

        .p3-title {
            font-family: 'Kaisei Decol', serif;
            font-size: 48pt;
            color: #e74c3c;
            text-shadow: 3px 3px 0 #fff, 5px 5px 0 #000;
            transform: rotate(-2deg);
        }

        .p3-sub {
            font-size: 24pt;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Bottom Info */
        .info-area {
            background: #2c3e50;
            color: white;
            flex-grow: 1;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .cta {
            font-size: 24pt;
            margin-bottom: 10px;
            color: #f1c40f;
        }

        .phone {
            font-size: 60pt;
            font-weight: 900;
            line-height: 1;
        }

        .features {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .feat-tag {
            background: #fff;
            color: #000;
            padding: 5px 15px;
            font-weight: bold;
            font-size: 14pt;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="comic-grid">
            <!-- Panel 1: Problem -->
            <div class="panel panel-1">
                <div class="bubble p1-text">
                    来週入居なのに<br>前の住人が<br>夜逃げ！？
                </div>
                <img class="p1-img" src="https://placehold.co/400x400/555/FFF?text=ゴミの山" alt="ゴミ屋敷">
            </div>

            <!-- Panel 2: Despair -->
            <div class="panel panel-2">
                <div class="bubble p2-text">
                    ゴミだらけで<br>内見もできない…<br>どうしよう…
                </div>
                <div style="position: absolute; bottom: 10px; right: 10px; font-size: 80pt;">😱</div>
            </div>

            <!-- Panel 3: Solution -->
            <div class="panel panel-3">
                <div class="p3-main">
                    <div class="p3-sub">そんな時は…</div>
                    <div class="p3-title">スマイリード！！</div>
                    <div style="font-size: 20pt; margin-top: 20px;">最短即日で全部撤去！</div>
                </div>
            </div>
        </div>

        <div class="info-area">
            <div class="cta">管理会社様の「困った」を即解決！</div>
            <div class="phone">0120-651-340</div>
            <div class="features">
                <div class="feat-tag">立ち会い不要</div>
                <div class="feat-tag">鍵預かりOK</div>
                <div class="feat-tag">写真報告</div>
            </div>
        </div>
    </div>
</body>

</html>
