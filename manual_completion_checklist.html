<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業完了・品質チェックシート</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            width: 210mm;
            min-height: 297mm;
            font-family: 'Noto Sans JP', sans-serif;
            color: #333;
            background: #fff;
            box-sizing: border-box;
            font-size: 10pt;
        }

        .sheet {
            width: 100%;
            padding: 10mm;
            box-sizing: border-box;
        }

        h1 {
            font-size: 18pt;
            text-align: center;
            border: 2px solid #333;
            padding: 2px;
            margin-bottom: 10px;
            background: #eee;
            font-size: 16pt;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 10px;
            font-size: 13pt;
        }

        .section {
            margin-bottom: 10px;
            border: 1px solid #333;
            padding: 5px;
        }

        .section-title {
            font-size: 12pt;
            font-weight: bold;
            background: #2c3e50;
            color: white;
            padding: 3px 15px;
            display: inline-block;
            margin-bottom: 5px;
        }

        .check-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .check-item {
            display: flex;
            align-items: center;
            padding: 5px;
            border-bottom: 1px dotted #ccc;
        }

        .check-item:last-child {
            border-bottom: none;
        }

        input[type="checkbox"] {
            transform: scale(1.5);
            margin-right: 10px;
        }

        .warning-text {
            color: #c0392b;
            font-weight: bold;
            font-size: 0.9em;
            margin-left: 10px;
        }

        /* Print Button Styles */
        @media print {
            .no-print {
                display: none !important;
            }
        }

        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 9999;
        }

        .print-btn:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>
    <button class="print-btn no-print" onclick="window.print()">🖨️ PDFで保存 / 印刷</button>

    <div class="sheet">
        <h1>作業完了・品質チェックシート</h1>

        <div class="header-info">
            <div>物件名：_________________________</div>
            <div>作業日：2026年__月__日</div>
            <div>責任者：__________</div>
        </div>



        <!-- 1. 残置物の見落とし確認 -->
        <div class="section">
            <div class="section-title">1. 残置物の見落とし確認</div>
            <div class="check-grid">
                <label class="check-item"><input type="checkbox"> 押し入れ・棚の中</label>
                <label class="check-item"><input type="checkbox"> 床下収納庫</label>
                <label class="check-item"><input type="checkbox"> ベランダ・バルコニー (物干し竿など)</label>
                <label class="check-item"><input type="checkbox"> 庭・建物外周（戸建ての場合）</label>
                <label class="check-item"><input type="checkbox"> メーターボックス内 (廊下)</label>
                <label class="check-item"><input type="checkbox"> ポスト内部</label>
                <label class="check-item"><input type="checkbox"> カーテンレール・フック</label>
                <label class="check-item"><input type="checkbox"> トイレ・お風呂の残置物</label>
                <label class="check-item"><input type="checkbox"> 照明器具 (取り外し必要か確認要)</label>
                <label class="check-item"><input type="checkbox"> サッシ撤去（市営住宅）</label>
                <label class="check-item"><input type="checkbox"> ウオッシュレットの現状回復（市営住宅）</label>
                <label class="check-item"><input type="checkbox"> トランクルームの確認</label>
            </div>
        </div>

        <!-- 2. 清掃品質の確認 -->
        <div class="section">
            <div class="section-title">2. 清掃品質の確認</div>
            <div class="check-grid">
                <label class="check-item"><input type="checkbox"> 壁のホコリ除去</label>
                <label class="check-item"><input type="checkbox"> 画鋲などの除去</label>
                <label class="check-item"><input type="checkbox"> 全部屋の掃除機・ほうきがけ</label>
                <label class="check-item"><input type="checkbox"> 玄関たたきの掃き掃除</label>
            </div>
        </div>

        <!-- 3. インフラ・戸締まり確認 -->
        <div class="section">
            <div class="section-title" style="background: #c0392b;">3. インフラ・戸締まり</div>
            <!-- Top row with 3 items -->
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; border-bottom: 1px dotted #ccc;">
                <label class="check-item" style="border-bottom: none;"><input type="checkbox"> ブレーカー（要確認）</label>
                <label class="check-item" style="border-bottom: none;"><input type="checkbox"> 水抜き（必要に応じて）</label>
                <label class="check-item" style="border-bottom: none;"><input type="checkbox"> 水道蛇口の閉め忘れ確認</label>
            </div>
            <!-- Remaining items -->
            <div class="check-grid" style="margin-top: 5px;">
                <label class="check-item"><input type="checkbox"> ガス栓の閉止</label>
                <label class="check-item"><input type="checkbox"> 全ての窓の施錠</label>
                <label class="check-item"><input type="checkbox"> 勝手口の施錠</label>
                <label class="check-item"><input type="checkbox"> 玄関の施錠</label>
            </div>
        </div>

        <!-- 4. 共用部・撤収作業 -->
        <div class="section">
            <div class="section-title">4. 共用部・撤収作業</div>
            <div class="check-grid">
                <label class="check-item"><input type="checkbox"> 搬出経路の清掃</label>
                <label class="check-item"><input type="checkbox"> エレベーター内の養生撤去</label>
                <label class="check-item"><input type="checkbox"> 床の養生撤去</label>
            </div>
        </div>

        <!-- 5. 最終報告アクション -->
        <div class="section">
            <div class="section-title">5. 最終報告アクション</div>
            <div class="check-grid">
                <label class="check-item"><input type="checkbox"> 完了写真 (全室) の撮影</label>
                <label class="check-item"><input type="checkbox"> 破損箇所の撮影・記録 (あれば)</label>
                <label class="check-item"><input type="checkbox"> 鍵の返却 (指定場所: _________________)</label>
                <label class="check-item"><input type="checkbox"> 買取品の確認（不可時は撤去／査定まで預かり）</label>
                <label class="check-item"><input type="checkbox"> お焚き上げ確認（送付先/氏名/住所/連絡先）</label>
                <label class="check-item"><input type="checkbox"> クライアントへの完了報告連絡</label>
            </div>
        </div>

    </div>
</body>

</html>
